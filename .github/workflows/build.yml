name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/checkout@v5
      - run: make download-tools
      - run: make install
      - run: make generate
      - run: make build-js
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: make lint
      - run: make test
      - if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$DOCKER_PASS" | docker login --username "traggoci" --password-stdin
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dedicated, REQUIRED PostgreSQL 17 job (FR-006 / WP04).
  #
  # The `build` job above still covers SQLite (and the full pipeline). This job
  # is the mandatory PostgreSQL gate: it runs the exact same cross-database
  # regression/acceptance fixtures (statistics incl. session-TZ and fractional
  # children, model, dashboard incl. text/bytea and reopen, device, test,
  # database migration/initialization) against a disposable PostgreSQL 17 server
  # AND SQLite in a single invocation, through the same safe launcher used
  # locally.
  #
  # The launcher (hack/test-databases.sh) starts its own postgres:17 container
  # on the Ubuntu host Docker runtime, published on IPv4 loopback only,
  # health-checks it, verifies the connected server is actually major 17,
  # cleans up on every exit, and forces required-mode. A missing/unusable
  # connection, a failed harness setup, or any skipped PostgreSQL suite makes
  # the job FAIL - a green job can never be SQLite-only. The `go test -json`
  # stream is then validated by hack/check-postgres-results.go against the
  # expected live-suite manifest (zero skipped PostgreSQL cases, all six
  # packages complete). No service container and no hardcoded DSN are supplied;
  # the launcher owns publishing, readiness/version checks and cleanup.
  postgres-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - uses: actions/checkout@v5
      # Install the Go code-generation tool (gqlgen). UI tooling is not needed
      # here: this job only runs the backend database suites.
      - run: make download-tools
      - run: make install-go
      # Generate GraphQL sources before running the backend tests.
      - run: make generate-go
      # Launcher shell regression suite (no server required): loopback
      # publishing, credential-safe output, required-mode failure and cleanup.
      - name: Launcher shell regression suite
        run: make test-database-launcher
      # SQLite + PostgreSQL 17 regression/acceptance suites (required). The
      # launcher self-starts the disposable server on the Ubuntu host Docker
      # runtime and the JSON result stream is validated by the result checker.
      - name: SQLite + PostgreSQL 17 regression/acceptance suites (required)
        run: make test-postgres